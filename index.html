<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mantenimiento del velero</title>
  <meta name="description" content="Cuaderno de bitácora, mantenimiento y avisos para un Jeanneau Sun Odyssey 36i.">
  <meta name="theme-color" content="#E8EEED" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0E1A24" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Velero">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/atkinson-hyperlegible-next-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <button class="skip" type="button" data-action="skip">Ir al contenido</button>
  <header class="top">
    <a class="boatlink" id="boat-name" href="#/barcos" data-nav="boats">Mi velero</a>
    <p id="sync" class="sync" role="status" aria-live="polite"></p>
    <a class="gear" href="#/ajustes" data-nav="gear" aria-label="Ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1"/></svg>
      <span>Ajustes</span></a>
  </header>
  <div id="update" class="update" hidden>
    <span>Hay una versión nueva de la app.</span>
    <button class="btn small" data-action="apply-update">Actualizar</button>
  </div>

  <main id="view" tabindex="-1"><p class="loading">Cargando…</p></main>

  <nav class="tabbar" aria-label="Secciones">
    <a href="#/" data-nav="home">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v14M12 4l7 12H12M12 6 6 15h6M4 19h16l-2 2H6z"/></svg>
      <span>Estado</span></a>
    <a href="#/trabajos" data-nav="work">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L4 17l3 3 5.3-5.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>
      <span>Trabajos</span></a>
    <a href="#/nuevo" data-nav="add" class="add">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>Apuntar</span></a>
    <a href="#/bitacora" data-nav="trips">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13.4 13.4 8.5 15.5 10.6 10.6z"/></svg>
      <span>Bitácora</span></a>
    <a href="#/historial" data-nav="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h10l3 3v15H6zM9 9h7M9 13h7M9 17h4"/></svg>
      <span>Historial</span></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
